name: Build EOS SDK Emu

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            triplet: x64-windows-static
          - arch: x86
            triplet: x86-windows-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg dependencies
        run: |
          vcpkg install protobuf:${{ matrix.triplet }} nlohmann-json:${{ matrix.triplet }}

      - name: Configure CMake
        run: |
          cmake -B build_${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build Release
        run: |
          cmake --build build_${{ matrix.arch }} --config Release

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: eos_sdk_emu-${{ matrix.arch }}
          path: build_${{ matrix.arch }}/**/Release/*.dll
