name: Build EOS SDK Emu

on:
  workflow_dispatch:
  push:
    branches: [ main, master, partyvan ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            vcpkg_triplet: x64-windows-static
            cmake_arch: x64
          - arch: x86
            vcpkg_triplet: x86-windows-static
            cmake_arch: Win32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install protobuf:${{ matrix.vcpkg_triplet }} nlohmann-json:${{ matrix.vcpkg_triplet }}

      - name: Configure CMake
        run: |
          cmake -B build_${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}

      - name: Build Release
        run: |
          cmake --build build_${{ matrix.arch }} --config Release

      - name: Upload compiled DLLs
        uses: actions/upload-artifact@v4
        with:
          name: eos_sdk_emu_${{ matrix.arch }}
          path: build_${{ matrix.arch }}/**/Release/*.dll
